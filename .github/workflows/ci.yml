name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: bayanometro_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bayanometro_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/bayanometro_db
          DB_USER: postgres
          DB_PASS: postgres
          TELEGRAM_BOT_TOKEN: dummy-bot-token
          TELEGRAM_WEBHOOK_SECRET: dummy-secret
          TELEGRAM_ALLOWED_USERS: 123456
          THE_ODDS_API_KEY: dummy-odds-key
          GEMINI_API_KEY: dummy-gemini-key
        run: ./mvnw clean verify -B
