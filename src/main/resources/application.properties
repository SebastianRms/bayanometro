quarkus.http.port=8080
quarkus.application.name=bayanometro
quarkus.application.version=1.0.0
quarkus.application.description=Asistente cuantitativo para análisis de valor esperado y gestión de bankroll con IA y RAG

# PostgreSQL & Data Source
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/bayanometro_db}
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASS:postgres}

# Flyway Migrations
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.mapping.format.global=ignore
%dev.quarkus.hibernate-orm.log.sql=true

# Telegram Bot & Security
bayanometro.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
bayanometro.telegram.webhook-secret=${TELEGRAM_WEBHOOK_SECRET:}
bayanometro.telegram.allowed-users=${TELEGRAM_ALLOWED_USERS:}
bayanometro.telegram.rate-limit-per-window=30
bayanometro.telegram.window-hours=6

# The Odds API (Cuotas y partidos en vivo)
bayanometro.odds-api.key=${THE_ODDS_API_KEY:}
bayanometro.odds-api.url=https://api.the-odds-api.com/v4
quarkus.rest-client.odds-api.url=${bayanometro.odds-api.url}
bayanometro.odds-api.sports=upcoming,soccer_epl,soccer_spain_la_liga,soccer_mexico_ligamx,soccer_uefa_champs_league,basketball_nba,americanfootball_nfl,baseball_mlb

# API-Sports (Opcional / Estadísticas H2H)
bayanometro.api-sports.key=${API_SPORTS_KEY:}
bayanometro.api-sports.football-url=https://v3.football.api-sports.io
quarkus.rest-client.api-sports-football.url=${bayanometro.api-sports.football-url}
bayanometro.api-sports.basketball-url=https://v1.basketball.api-sports.io
bayanometro.api-sports.baseball-url=https://v1.baseball.api-sports.io
bayanometro.api-sports.american-football-url=https://v1.american-football.api-sports.io
bayanometro.api-sports.preferred-bookmaker=6
bayanometro.api-sports.daily-budget=100
bayanometro.api-sports.retry-max=3
bayanometro.api-sports.retry-delay-ms=2000

# Scheduler & Timezone
bayanometro.batch.morning.cron=0 0 8 * * ?
bayanometro.batch.afternoon.cron=0 0 14 * * ?
bayanometro.batch.night.cron=0 0 20 * * ?
bayanometro.batch.timezone=America/Mexico_City

# Staking Rules & Risk Cushion (Kelly Criterion)
bayanometro.staking.colchon=0.15
bayanometro.staking.directa-pct=0.25
bayanometro.staking.parlay-pct=0.20
bayanometro.staking.piso-critico=10.00

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.path=/q/openapi

# Vector Store & RAG (pgvector + in-process ONNX embeddings)
quarkus.langchain4j.pgvector.table=strategy_embeddings
quarkus.langchain4j.pgvector.dimension=384
quarkus.langchain4j.pgvector.create-table=true
quarkus.langchain4j.embedding-model.provider=dev.langchain4j.model.embedding.onnx.allminilml6v2.AllMiniLmL6V2EmbeddingModel
bayanometro.rag.max-results=3
bayanometro.rag.min-score=0.72
bayanometro.rag.force-reingest=false
quarkus.datasource.devservices.image-name=pgvector/pgvector:pg16

# LLM: Proveedor por defecto Gemini
quarkus.langchain4j.chat-model.provider=ai-gemini
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:dummy-key}
quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-3.5-flash-lite
quarkus.langchain4j.ai.gemini.chat-model.temperature=0.2

# LLM: Perfil alternativo DeepSeek (OpenAI-compatible)
%deepseek.quarkus.langchain4j.chat-model.provider=openai
%deepseek.quarkus.langchain4j.openai.base-url=${LLM_BASE_URL:https://api.deepseek.com/v1}
%deepseek.quarkus.langchain4j.openai.api-key=${LLM_API_KEY:dummy-key}
%deepseek.quarkus.langchain4j.openai.chat-model.model-name=deepseek-chat
%deepseek.quarkus.langchain4j.openai.chat-model.temperature=0.2

# LLM: Perfil explícito Gemini
%gemini.quarkus.langchain4j.chat-model.provider=ai-gemini
%gemini.quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY:}
%gemini.quarkus.langchain4j.ai.gemini.chat-model.model-id=gemini-3.5-flash-lite
%gemini.quarkus.langchain4j.ai.gemini.chat-model.temperature=0.2
%gemini.quarkus.langchain4j.ai.gemini.timeout=180s

# Timeout de transacciones JTA (Narayana)
quarkus.transaction-manager.default-transaction-timeout=300

# Perfil de pruebas
%test.quarkus.langchain4j.chat-model.provider=openai
%test.quarkus.langchain4j.openai.api-key=dummy-key
%test.quarkus.langchain4j.embedding-model.provider=dev.langchain4j.model.embedding.onnx.allminilml6v2.AllMiniLmL6V2EmbeddingModel
%test.bayanometro.telegram.allowed-users=123456
%test.bayanometro.telegram.webhook-secret=dummy-secret
%test.bayanometro.telegram.bot-token=dummy-token
%test.bayanometro.api-sports.key=dummy-api-key
%test.bayanometro.odds-api.key=dummy-odds-key
%test.bayanometro.odds-api.url=https://api.the-odds-api.com/v4
